appId: com.grenjo.aitool
productName: Grenjo AI Tool
copyright: Personal use build

directories:
  output: release
  buildResources: build

# Only the compiled bundles and the manifest ship. Source, tests and the agent
# run sink never enter the installer.
files:
  - dist/**/*
  - package.json
  - '!**/*.map'
  - '!.work/**'
  - '!release/**'
  - '!tests/**'
  - '!src/**'

asar: true
asarUnpack: []

# Flips the Electron fuses on the packaged binary before the installer is built.
afterPack: scripts/after-pack.cjs

# User data lives in %APPDATA%\Grenjo AI Tool (Electron's userData; a legacy
# "Personal AI Desk" profile is migrated forward once), which is outside the
# install directory, so upgrades and uninstalls never touch chats or settings.
# `deleteAppDataOnUninstall` stays false for the same reason.
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Grenjo AI Tool
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  differentialPackage: true

# macOS.
#
# A mac target needs **no application code**: node:sqlite comes with Electron's
# Node, safeStorage is the Keychain, and every path is derived from userData. What
# it needs is packaging — and an identity, which is the one part this repository
# cannot supply.
#
# `hardenedRuntime` is required for notarization and denies microphone access by
# default, so the entitlements file asks for exactly two things the app uses: the
# JavaScript engine's JIT and audio input. `NSMicrophoneUsageDescription` is not
# optional decoration — macOS terminates an app that calls getUserMedia without it,
# so the voice feature would become a crash rather than a refusal.
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  # Notarization is done by electron-builder when credentials are present; without
  # them the app is unsigned and Gatekeeper warns, exactly like the Windows build.
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Grenjo AI Tool records a voice memo only when you press record. The audio is
      sent to the transcription provider you configured, or kept on this machine.
    NSHumanReadableCopyright: Personal use build

dmg:
  title: ${productName}
  # The window has no background image: a background is packaging art this project
  # does not maintain, and an empty one is better than a stale one.
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 190
      type: file
    # The Applications shortcut is what makes a DMG installable by dragging.
    - x: 390
      y: 190
      type: link
      path: /Applications

# Auto-update feed.
#
# electron-updater reads this from the packaged app-update.yml, so the owner and
# repository are compiled into the app. There is no token here and no token is
# needed: the releases are public, and an update is only installed if its sha512
# matches the digest the feed publishes. A build made without this block simply
# has no feed and reports "updates are not available".
publish:
  provider: github
  owner: princegrenjo-create
  repo: GrenjoAI
  releaseType: release
